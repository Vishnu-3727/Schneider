services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: joulemitra
      POSTGRES_PASSWORD: joulemitra
      POSTGRES_DB: joulemitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joulemitra"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://joulemitra:joulemitra@db:5432/joulemitra
      TEST_DATABASE_URL: postgresql+psycopg://joulemitra:joulemitra@db:5432/joulemitra_test
      API_BASE_URL: http://backend:8000
      TZ: Asia/Kolkata
      STALE_AFTER_S: 900
      CLOCK_SKEW_S: 300
      SPIKE_MULTIPLE: 1.5
      ENERGY_INTERVAL_S: 3600
      MIN_COVERAGE_PCT: 80.0
      MIN_BASELINE_INTERVALS: 24
      BASELINE_HOLDOUT_FRACTION: 0.2
      EXPECTED_EPSILON_KWH: 0.5
      DEVIATION_WARN_PCT: 15.0
      DEVIATION_CRIT_PCT: 30.0
      DEVIATION_CONSECUTIVE_N: 2
      IDLE_SHARE_THRESHOLD: 0.5
      IDLE_CONSECUTIVE_N: 4
      RATED_POWER_MULTIPLE: 1.1
      PF_MIN_THRESHOLD: 0.6
      MAD_THRESHOLD: 4.0
      MAD_WINDOW: 24
      NON_PRODUCTION_TYPES: pump
      BASELINE_MODEL_VERSION: v1-linear
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "apps.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build: .
    environment:
      API_BASE_URL: http://backend:8000
      TZ: Asia/Kolkata
    ports:
      - "8501:8501"
    depends_on:
      - backend
    command: ["streamlit", "run", "apps/dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  pgdata:
