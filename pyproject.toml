[project]
name = "joulemitra"
version = "0.1.0"
description = "JouleMitra Phase 1: simulator, API, database, dashboard (no ML)"
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.118.2",
  "starlette>=0.46,<0.49",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "numpy==2.2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "streamlit>=1.38",
  "plotly>=5.24",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "ortools==9.15.6755",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]
# Optional PBL adapter extra: ONNX Runtime for the external C-MAPSS RUL
# model (services/machine_health/pbl_adapter.py). NOT a core dependency:
# the adapter reports UNAVAILABLE when onnxruntime is not installed.
pbl = [
  "onnxruntime>=1.19",
  "numpy==2.2.1",
]
# Edge gateway extra (edge/): MQTT + Modbus TCP clients. The gateway runs
# on its own (PC or Raspberry Pi) and reaches the backend only over HTTP.
edge = [
  "paho-mqtt==2.1.0",
  "pymodbus==3.15.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "services*", "edge*"]
